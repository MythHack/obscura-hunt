<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>form control geometry</title>
  <style>
    /* Browser form controls default to a host UI font. Pin the bundled faces so
       both engines fit native control box geometry from the same metrics. */
    @font-face {
      font-family: "Liberation Sans";
      src: url("../crates/obscura-render/assets/liberation-sans.ttf");
      font-weight: 400;
      font-style: normal;
      font-display: block;
      line-gap-override: 3.2715%;
    }
    @font-face {
      font-family: "Liberation Sans";
      src: url("../crates/obscura-render/assets/liberation-sans-bold.ttf");
      font-weight: 700;
      font-style: normal;
      font-display: block;
      line-gap-override: 3.2715%;
    }
    html, body { margin: 0; }
    body { font-family: "Liberation Sans", sans-serif; }
    input:not([type]), input[type="text"] {
      font-family: "Liberation Sans", sans-serif;
      font-size: 13.3333px;
    }
    .form-case {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
    }
    .row {
      position: absolute;
      display: flex;
      align-items: flex-start;
    }
    .text-row { left: 350px; top: 0; }
    .override-row { left: 700px; top: 0; }
    .checkbox-row { left: 0; top: 100px; }
    .range-row { left: 200px; top: 100px; }
    .hidden-row { left: 500px; top: 100px; }
    .textarea-row { left: 0; top: 200px; }
    .textarea-rows8-row { left: 350px; top: 200px; }
    .marker { width: 20px; }
    .form-marker { width: 100px; height: 20px; background: #087f5b; }
    .text-marker { height: 21px; background: #1971c2; }
    .override-marker { height: 30px; background: #e8590c; }
    .checkbox-marker { height: 13px; background: #7048e8; }
    .range-marker { height: 16px; background: #c2255c; }
    .hidden-marker { height: 20px; background: #2b8a3e; }
    .textarea-marker { height: 36px; background: #f08c00; }
    .textarea-rows8-marker { height: 126px; background: #e64980; }
  </style>
</head>
<body>
  <div class="form-case">
    <form><input size="17"></form>
    <div class="form-marker"></div>
  </div>
  <div class="row text-row"><input size="17"><div class="marker text-marker"></div></div>
  <div class="row override-row">
    <input size="40" style="width: 100px; height: 30px">
    <div class="marker override-marker"></div>
  </div>
  <div class="row checkbox-row"><input type="checkbox"><div class="marker checkbox-marker"></div></div>
  <div class="row range-row"><input type="range"><div class="marker range-marker"></div></div>
  <div class="row hidden-row"><input type="hidden"><div class="marker hidden-marker"></div></div>
  <div class="row textarea-row"><textarea></textarea><div class="marker textarea-marker"></div></div>
  <div class="row textarea-rows8-row"><textarea rows="8"></textarea><div class="marker textarea-rows8-marker"></div></div>
  <section style="position:absolute;left:0;top:380px;width:800px">
    <details id="native-details">
      <summary id="native-summary">Disclosure <button id="summary-button" type="button">Independent action</button></summary>
      <summary id="later-summary">Not the activation summary</summary>
      <p id="details-content" style="height:32px;background:#d3f9d8">Revealed content</p>
    </details>
    <label>Native range <input id="native-range" type="range" min="0" max="100" step="10" value="50" style="width:200px"></label>
    <label>RTL <input id="rtl-range" type="range" min="0" max="100" step="10" value="50" style="width:200px;direction:rtl"></label>
    <label>Disabled <input id="disabled-range" type="range" disabled value="50" style="width:200px"></label>
    <label>No theme <input id="plain-range" type="range" min="0" max="100" step="10" value="50" style="width:200px;appearance:none"></label>
    <input id="default-range" type="range">
  </section>
  <script>
    window.nativeEvents = [];
    for (const id of ['native-range', 'rtl-range', 'disabled-range', 'plain-range']) {
      const control = document.getElementById(id);
      for (const type of ['input', 'change']) control.addEventListener(type, event => {
        nativeEvents.push({id, type, trusted:event.isTrusted, value:control.value});
      });
    }
    document.getElementById('native-details').addEventListener('toggle', event => {
      nativeEvents.push({id:'native-details', type:'toggle', oldState:event.oldState, newState:event.newState, trusted:event.isTrusted});
    });
  </script>
</body>
</html>
